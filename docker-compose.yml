x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-interviewpilot}:${POSTGRES_PASSWORD:-interviewpilot}@postgres:5432/${POSTGRES_DB:-interviewpilot}
  LANGGRAPH_CHECKPOINT_DATABASE_URL: postgresql://${POSTGRES_USER:-interviewpilot}:${POSTGRES_PASSWORD:-interviewpilot}@postgres:5432/${POSTGRES_DB:-interviewpilot}
  DOCUMENT_STORAGE_ROOT: /app/data/uploads
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  OPENSEARCH_URL: http://opensearch:9200
  MCP_RETRIEVAL_ENABLED: ${MCP_RETRIEVAL_ENABLED:-true}
  MCP_RETRIEVAL_URL: http://retrieval-mcp:8011/mcp
  MCP_REPORT_ENABLED: ${MCP_REPORT_ENABLED:-true}
  MCP_REPORT_URL: http://report-mcp:8012/mcp
  MCP_CALL_TIMEOUT_SECONDS: ${MCP_CALL_TIMEOUT_SECONDS:-20}
  MCP_INTERNAL_SECRET: ${MCP_INTERNAL_SECRET:-}
  MCP_ARTIFACT_STORAGE_ROOT: /app/data/mcp-artifacts
  OCR_WORKER_ENABLED: ${OCR_WORKER_ENABLED:-false}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}

# FastAPI, Celery, migrations and both MCP servers run the same application
# code. Build and tag it once through the migrate service, then reuse it.
x-backend-image: &backend-image ${BACKEND_IMAGE:-interviewpilot-app}:${APP_IMAGE_TAG:-latest}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interviewpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interviewpilot}
      POSTGRES_DB: ${POSTGRES_DB:-interviewpilot}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/docker/init.sql:/docker-entrypoint-initdb.d/001-foundation.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-interviewpilot} -d ${POSTGRES_DB:-interviewpilot}
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow' || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  migrate:
    image: *backend-image
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-environment
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: *backend-image
    # This image is produced locally by the migrate build target. Never try to
    # resolve the private application tag from Docker Hub.
    pull_policy: never
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-environment
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - document-data:/app/data/uploads
      - mcp-artifacts:/app/data/mcp-artifacts
      - backend-logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=4)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  celery-worker:
    image: *backend-image
    pull_policy: never
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-environment
    command:
      - celery
      - -A
      - app.workers.celery_app.celery_app
      - worker
      - --loglevel=info
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
      - -Q
      - celery
    volumes:
      - document-data:/app/data/uploads
      - backend-logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  retrieval-mcp:
    image: *backend-image
    pull_policy: never
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-environment
    command: python -m mcp_servers.retrieval_server
    depends_on:
      migrate:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; s=socket.create_connection(('127.0.0.1',8011),3); s.close()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  report-mcp:
    image: *backend-image
    pull_policy: never
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-environment
    command: python -m mcp_servers.report_server
    volumes:
      - mcp-artifacts:/app/data/mcp-artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; s=socket.create_connection(('127.0.0.1',8012),3); s.close()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  ocr-worker:
    profiles: ["ocr"]
    build:
      context: ./backend
      dockerfile: ocr_worker/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-interviewpilot}:${POSTGRES_PASSWORD:-interviewpilot}@postgres:5432/${POSTGRES_DB:-interviewpilot}
      DOCUMENT_STORAGE_ROOT: /app/data/uploads
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OCR_CELERY_QUEUE: ocr
      CELERY_MAIN_QUEUE: celery
    volumes:
      - document-data:/app/data/uploads
      - backend-logs:/app/logs
      - paddle-models:/root/.paddleocr
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  gateway:
    profiles: ["production"]
    image: caddy:2.10-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  opensearch-data:
  document-data:
  backend-logs:
  mcp-artifacts:
  paddle-models:
  caddy-data:
  caddy-config:
